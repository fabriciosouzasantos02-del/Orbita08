<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient representing space depth -->
    <radialGradient id="space-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    
    <!-- Central Diamond Gradient matching Portal Orbita's premium UI -->
    <linearGradient id="diamond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" /> <!-- amber 400 -->
      <stop offset="50%" stop-color="#f59e0b" /> <!-- amber 500 -->
      <stop offset="100%" stop-color="#f43f5e" /> <!-- rose 500 -->
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#space-grad)" />

  <!-- Outer constellation ring -->
  <circle cx="256" cy="256" r="210" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 12" fill="none" />

  <!-- Inner precise cosmic ring -->
  <circle cx="256" cy="256" r="150" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.3" fill="none" />
  
  <!-- Grid alignment axes -->
  <line x1="256" y1="50" x2="256" y2="462" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4" />
  <line x1="50" y1="256" x2="462" y2="256" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Central gleaming geometric diamond representing cosmic precision -->
  <g transform="translate(256, 256) rotate(45)">
    <rect x="-80" y="-80" width="160" height="160" rx="12" fill="url(#diamond-grad)" filter="drop-shadow(0 0 24px rgba(245,158,11,0.45))" />
  </g>

  <!-- Central Star of Guidance (Sparkle) -->
  <g transform="translate(256, 256)">
    <!-- Vertical sparkle line -->
    <path d="M 0,-45 Q 0,0 45,0 Q 0,0 0,45 Q 0,0 -45,0 Q 0,0 0,-45 Z" fill="#030712" />
    <!-- Secondary internal glowing core -->
    <path d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Ambient Orbit Node (Rose-colored planet) -->
  <circle cx="362" cy="150" r="16" fill="#f43f5e" stroke="#02040a" stroke-width="4" />
</svg>
