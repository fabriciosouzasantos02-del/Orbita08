<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient representing space depth -->
    <radialGradient id="space-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    
    <!-- Central Diamond Gradient matching Portal Orbita's premium UI -->
    <linearGradient id="diamond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" /> <!-- amber 400 -->
      <stop offset="50%" stop-color="#f59e0b" /> <!-- amber 500 -->
      <stop offset="100%" stop-color="#f43f5e" /> <!-- rose 500 -->
    </linearGradient>
  </defs>

  <!-- App Icon Background - Full bleed for maskable cropping -->
  <rect width="512" height="512" fill="url(#space-grad)" />

  <!-- Outer constellation ring (sized down to 180 to fit comfortable safe-zone) -->
  <circle cx="256" cy="256" r="180" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 12" fill="none" />

  <!-- Inner precise cosmic ring -->
  <circle cx="256" cy="256" r="128" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" fill="none" />
  
  <!-- Grid alignment axes -->
  <line x1="256" y1="76" x2="256" y2="436" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4" />
  <line x1="76" y1="256" x2="436" y2="256" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Central gleaming geometric diamond representing cosmic precision (sized down slightly) -->
  <g transform="translate(256, 256) rotate(45)">
    <rect x="-65" y="-65" width="130" height="130" rx="10" fill="url(#diamond-grad)" filter="drop-shadow(0 0 20px rgba(245,158,11,0.45))" />
  </g>

  <!-- Central Star of Guidance (Sparkle) -->
  <g transform="translate(256, 256)">
    <!-- Vertical sparkle line -->
    <path d="M 0,-38 Q 0,0 38,0 Q 0,0 0,38 Q 0,0 -38,0 Q 0,0 0,-38 Z" fill="#030712" />
    <!-- Secondary internal glowing core -->
    <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Ambient Orbit Node (Rose-colored planet) -->
  <circle cx="346" cy="166" r="14" fill="#f43f5e" stroke="#02040a" stroke-width="3" />
</svg>
